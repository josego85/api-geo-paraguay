name: Scorecard Security Check

on:
  push:
    branches: ['master', 'dev']
  pull_request:
    branches: ['master']
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays at 00:00

jobs:
  scorecard:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v5.0.0

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_format: sarif
          results_file: ./scorecard-results.sarif
          publish_results: false # API Scorecard
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: ./scorecard-results.sarif
